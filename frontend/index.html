<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <!--
      Preload the homepage hero image while the shell is still parsing.
      The hero <img> is rendered by React, so without this the browser
      only discovers it after the JavaScript bundle downloads and
      executes — 0.9–1.8 s of LCP load delay in every mobile Lighthouse
      run, with the request flagged "not discoverable in initial
      document". The imagesrcset/imagesizes below must match the
      <picture> in src/pages/LandingPage.jsx exactly, so the preloaded
      candidate is the same file the <img> uses (no double download).
      The shell is served for every route, so this only fires on "/" —
      other pages must not pay for a 156 KiB image they never show.
    -->
    <script src="/hero-preload.js"></script>
    <link rel="icon" type="image/svg+xml" sizes="any" href="/gnosis.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Homepage metadata in the initial HTML. Search engines and social
      scrapers that do not execute JavaScript read this shell as the
      homepage, so it carries the homepage's own title, description,
      Open Graph and Twitter tags, and WebSite structured data
      (see src/utils/seo.js for the same values). Every route renders
      the <Seo> component, which replaces these tags at runtime with
      the page's own metadata; the JSON-LD script below carries
      data-seo-jsonld so <Seo> updates or removes that same node on
      navigation instead of creating a second WebSite block.
      No canonical tag lives here on purpose: the SPA shell is served
      for every route, so a static canonical would point every chapter
      URL at the wrong address. Each route sets its own canonical at
      runtime, and the homepage's canonical is its own URL by default.
      The PNG favicon is the Google Search favicon: Google's supported
      formats do not include SVG, so the SVG alone showed a generic
      globe in search results. The PNG is rasterized from the same
      /gnosis.svg logo mark at 192x192; the SVG link stays for
      browsers, and the PNG doubles as the Apple touch icon.
    -->
    <meta
      name="description"
      content="Explore Scripture alongside trusted commentary and discover the connections between God’s Word, theology, history, and Christian thought."
    />
    <meta property="og:title" content="Gnosis | Explore Scripture, Theology & Christian History" />
    <meta
      property="og:description"
      content="Explore Scripture alongside trusted commentary and discover the connections between God’s Word, theology, history, and Christian thought."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gnosis" />
    <meta property="og:url" content="https://studygnosis.com/" />
    <meta property="og:image" content="https://studygnosis.com/images/landing/sunset-hero-images/hero-1200.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="675" />
    <meta property="og:image:alt" content="A laptop and a phone showing the Gnosis Bible study app, resting on desert sand at sunset" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gnosis | Explore Scripture, Theology & Christian History" />
    <meta
      name="twitter:description"
      content="Explore Scripture alongside trusted commentary and discover the connections between God’s Word, theology, history, and Christian thought."
    />
    <meta name="twitter:image" content="https://studygnosis.com/images/landing/sunset-hero-images/hero-1200.jpg" />
    <script type="application/ld+json" data-seo-jsonld>
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Gnosis",
        "url": "https://studygnosis.com/",
        "description": "Explore Scripture alongside trusted commentary and discover the connections between God’s Word, theology, history, and Christian thought.",
        "inLanguage": "en"
      }
    </script>
    <title>Gnosis | Explore Scripture, Theology & Christian History</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
